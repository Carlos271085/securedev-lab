
name: securedev-estudiante

services:
  app:
    build: .
    environment:
      DATABASE_PATH: /data/securedev.db
      SECRET_KEY: ${SECRET_KEY:?Debes definir SECRET_KEY en .env}
    volumes:
      - app_data:/data
    ports:
      - "127.0.0.1:8000:8000"

  prometheus:
    image: prom/prometheus:v2.54.1
    container_name: securedev-prometheus
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml:ro
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
    ports:
      - "127.0.0.1:9090:9090"
    depends_on:
      - app

  grafana:
    image: grafana/grafana:11.3.0
    container_name: securedev-grafana
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: admin
    ports:
      - "127.0.0.1:3000:3000"
    volumes:
      - grafana_data:/var/lib/grafana
    depends_on:
      - prometheus

volumes:
  app_data:
  grafana_data:
